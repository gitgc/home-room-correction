[project]
name = "roomeq"
version = "0.1.0"
description = "Room correction CLI: measure with a UMIK-1 and fit a 10-band parametric EQ"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "sounddevice>=0.4.6",
    "matplotlib>=3.8",
]

[project.scripts]
roomeq = "roomeq.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest>=8"]
